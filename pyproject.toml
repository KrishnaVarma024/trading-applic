[project]
name = "tradingapp"
version = "0.1.0"
description = "Live market-data pipeline: ticks -> bars -> realized-volatility forecast"
requires-python = ">=3.10"
dependencies = ["websockets>=15.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingapp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
